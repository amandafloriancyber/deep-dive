<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deep-dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#021828;
    height:100vh; width:100vw;
    overflow:hidden;
    font-family:'Jost',sans-serif;
  }

  #ocean-bg {
    position:fixed; inset:0; z-index:0;
    background:linear-gradient(to bottom,
      #021828 0%,#032030 20%,#053545 45%,
      #084060 70%,#0a5570 85%,#0d7a8a 100%);
  }
  #water-shift {
    position:fixed; inset:0; z-index:1;
    background:radial-gradient(ellipse 80% 60% at 50% 120%,rgba(13,122,138,0.3) 0%,transparent 70%);
    animation:waterBreath 9s ease-in-out infinite alternate;
  }
  @keyframes waterBreath {
    0%  { transform:scaleX(1) translateY(0); opacity:0.5; }
    100%{ transform:scaleX(1.08) translateY(-15px); opacity:0.9; }
  }

  canvas { position:fixed; inset:0; pointer-events:none; }
  #rays-canvas  { z-index:2; }
  #haze-canvas  { z-index:3; }
  #part-canvas  { z-index:4; }
  #notes-canvas { z-index:5; }
  #creat-canvas { z-index:6; pointer-events:all; cursor:default; }

  #bubbles-container { position:fixed; inset:0; z-index:7; pointer-events:none; }

  /* ── RIPPLE ── */
  .ripple {
    position:fixed; border-radius:50%; pointer-events:none; z-index:8;
    border:1px solid rgba(180,230,255,0.22);
    animation:rippleOut var(--rdur,1s) ease-out forwards;
  }
  @keyframes rippleOut {
    0%  { transform:scale(0); opacity:0.6; }
    100%{ transform:scale(1); opacity:0; }
  }

  /* ── BUBBLE ── */
  .bubble {
    position:absolute; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:12px 16px;
    backdrop-filter:blur(10px);
    background:radial-gradient(circle at 30% 28%,
      rgba(255,255,255,0.35),
      rgba(180,240,255,0.1) 55%,
      rgba(200,180,255,0.06));
    border:1px solid rgba(255,255,255,0.38);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.65),
      inset 0 -1px 0 rgba(180,220,255,0.12),
      0 0 22px rgba(160,220,255,0.2),
      0 0 55px rgba(180,160,255,0.08);
    color:rgba(255,255,255,0.92);
    font-family:'Jost',sans-serif; font-weight:300;
    font-size:12px; letter-spacing:0.05em; line-height:1.4;
    pointer-events:none;
    opacity:0; transform:scale(0);
    transition:box-shadow 0.3s;
    user-select:none; -webkit-user-select:none;
    cursor:default;
  }

  .bubble.settled {
    pointer-events:all;
    opacity:1;
    animation:bubbleIdle var(--idle-dur,5s) ease-in-out infinite alternate;
    transition:
      transform 0.5s cubic-bezier(0.34,1.3,0.64,1),
      box-shadow 0.3s,
      left 0.85s cubic-bezier(0.25,0.46,0.45,0.94),
      top  0.85s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  @keyframes bubbleIdle {
    0%  { transform:scale(var(--bubble-scale,0.68)) translateY(0px) translateX(-2px); }
    100%{ transform:scale(var(--bubble-scale,0.68)) translateY(-7px) translateX(2px); }
  }
  /* hover: lift up so text is readable */
  .bubble.settled:hover {
    transform:scale(0.85) translateY(-22px) !important;
    animation:none !important;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.75),
      0 0 42px rgba(160,220,255,0.55),
      0 0 95px rgba(180,160,255,0.28);
    z-index:15;
  }
  .bubble.expanded {
    pointer-events:all;
    opacity:1;
    transform:scale(1.08) !important;
    z-index:20; animation:none !important;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,0.8),
      0 0 50px rgba(160,220,255,0.55),
      0 0 110px rgba(180,160,255,0.3);
    transition:
      transform 0.45s cubic-bezier(0.34,1.3,0.64,1),
      box-shadow 0.3s,
      left 0.85s cubic-bezier(0.25,0.46,0.45,0.94),
      top  0.85s cubic-bezier(0.25,0.46,0.45,0.94);
  }

  /* ── LYRIC FLOAT ── */
  #lyric-float {
    position:fixed; left:0; right:0; z-index:9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; top:38%;
    opacity:0; transition:opacity 0.8s ease;
  }
  #lyric-text {
    font-family:'Jost',sans-serif; font-weight:200;
    font-size:15px; letter-spacing:0.14em;
    color:rgba(255,255,255,0.88);
    text-align:center; max-width:340px;
    text-shadow:0 0 18px rgba(160,220,255,0.8), 0 0 40px rgba(180,160,255,0.5);
    font-style:italic;
    user-select:none;
  }
  #lyric-notes {
    margin-top:10px; font-size:16px;
    color:rgba(160,220,255,0.55);
    letter-spacing:0.3em;
  }

  /* ── UI ── */
  #ui {
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    padding-bottom:44px; gap:10px;
  }
  #title-block { text-align:center; margin-bottom:4px; }
  #title-block h1 {
    font-family:'Outfit',sans-serif;
    font-weight:200; font-size:24px;
    letter-spacing:0.08em; color:rgba(255,255,255,0.88);
    text-transform:lowercase;
  }
  #input-row {
    display:flex; align-items:stretch;
    width:min(480px,88vw);
    border-radius:40px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.16);
    background:rgba(2,18,30,0.55);
    backdrop-filter:blur(16px);
    box-shadow:0 0 28px rgba(13,122,138,0.16),inset 0 1px 0 rgba(255,255,255,0.09);
    transition:border-color 0.3s,box-shadow 0.3s;
  }
  #input-row:focus-within {
    border-color:rgba(79,216,232,0.36);
    box-shadow:0 0 38px rgba(79,216,232,0.11),inset 0 1px 0 rgba(255,255,255,0.13);
  }
  #song-input {
    flex:1; background:transparent; border:none; outline:none;
    color:rgba(255,255,255,0.9);
    font-family:'Jost',sans-serif; font-weight:300;
    font-size:14px; letter-spacing:0.05em;
    padding:14px 20px; caret-color:#4fd8e8;
  }
  #song-input::placeholder { color:rgba(160,210,225,0.3); font-style:italic; }
  #send-btn {
    background:transparent; border:none;
    border-left:1px solid rgba(255,255,255,0.09);
    color:rgba(160,210,225,0.62);
    padding:0 18px; cursor:pointer;
    transition:color 0.2s,background 0.2s;
    display:flex; align-items:center; justify-content:center;
  }
  #send-btn:hover { color:rgba(79,216,232,0.95); background:rgba(79,216,232,0.05); }
  #send-btn:active { transform:scale(0.95); }
</style>
</head>
<body>

<!-- ── PASSWORD GATE ── -->
<div id="gate" style="position:fixed;inset:0;z-index:999;background:#020d1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0px;">
  <div style="font-size:28px;color:rgba(255,255,255,0.88);margin-bottom:-8px;">&#9834;</div>
  <p style="font-family:'Outfit',sans-serif;font-weight:200;font-size:26px;letter-spacing:0.08em;color:rgba(255,255,255,0.85);text-transform:lowercase;">deep-dive</p>
  <div style="display:flex;align-items:stretch;margin-top:10px;border-radius:40px;overflow:hidden;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);">
    <input id="gate-input" type="password" placeholder="password" autocomplete="off"
      style="background:transparent;border:none;outline:none;padding:12px 20px;color:rgba(255,255,255,0.85);font-family:'Jost',sans-serif;font-size:14px;letter-spacing:0.08em;text-align:center;width:180px;" />
    <button id="gate-btn" style="background:transparent;border:none;border-left:1px solid rgba(255,255,255,0.08);padding:0 16px;cursor:pointer;color:rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <p id="gate-error" style="font-family:'Jost',sans-serif;font-size:12px;color:rgba(255,100,100,0.7);letter-spacing:0.08em;opacity:0;transition:opacity 0.3s;margin-top:6px;">incorrect password</p>
</div>
<script>
(function(){
  var PASS = 'itiswell';
  var gate = document.getElementById('gate');
  var inp  = document.getElementById('gate-input');
  var btn  = document.getElementById('gate-btn');
  var err  = document.getElementById('gate-error');

  if (sessionStorage.getItem('dd_auth') === '1') {
    gate.style.display = 'none';
    return;
  }

  function tryLogin() {
    if (inp.value === PASS) {
      sessionStorage.setItem('dd_auth', '1');
      gate.style.transition = 'opacity 0.7s';
      gate.style.opacity = '0';
      setTimeout(function(){ gate.style.display = 'none'; }, 700);
    } else {
      err.style.opacity = '1';
      inp.value = '';
      setTimeout(function(){ err.style.opacity = '0'; }, 2000);
    }
  }

  btn.addEventListener('click', tryLogin);
  inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); tryLogin(); }
  });
  inp.addEventListener('keyup', function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); tryLogin(); }
  });

  setTimeout(function(){ inp.focus(); }, 100);
})();
</script>

<div id="ocean-bg"></div>
<div id="water-shift"></div>
<canvas id="rays-canvas"></canvas>
<canvas id="haze-canvas"></canvas>
<canvas id="part-canvas"></canvas>
<canvas id="notes-canvas"></canvas>
<canvas id="creat-canvas"></canvas>
<div id="bubbles-container"></div>

<!-- LYRIC FLOAT (canvas-drawn, no DOM text) -->
<canvas id="lyric-canvas" style="position:fixed;inset:0;z-index:11;pointer-events:none;"></canvas>

<div id="ui">
  <div id="title-block">
    <h1>deep-dive</h1>
  </div>
  <div id="input-row">
    <input id="song-input" type="text" placeholder="a worship song I'd love to dive into…" maxlength="80" autocomplete="off" />
    <button id="send-btn" title="Send">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 13V3M8 3L4 7M8 3L12 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
const W=()=>window.innerWidth;
const H=()=>window.innerHeight;
let mouseX=W()/2, mouseY=H()/2;
let lastMX=mouseX, lastMY=mouseY;

// ── MOUSE: net cursor + ocean skimming effect ──
// Hide default cursor
// No custom cursor

const rushCanvas=document.createElement('canvas');
rushCanvas.style.cssText='position:fixed;inset:0;z-index:8;pointer-events:none;';
document.body.appendChild(rushCanvas);
const rushCtx=rushCanvas.getContext('2d');
rushCanvas.width=W(); rushCanvas.height=H();

// Wake trail left behind as cursor skims
let wakeTrail=[];
let prevMX=mouseX, prevMY=mouseY;

document.addEventListener('mousemove',e=>{
  const vx=e.clientX-mouseX, vy=e.clientY-mouseY;
  mouseX=e.clientX; mouseY=e.clientY;
  const spd=Math.sqrt(vx*vx+vy*vy);
  if(spd>1.5){
    // Two diverging wake lines, one each side of the net path
    const nx=-vy/Math.max(spd,1), ny=vx/Math.max(spd,1);
    for(let side=-1;side<=1;side+=2){
      wakeTrail.push({
        x:mouseX+nx*side*7,
        y:mouseY+ny*side*7,
        vx:nx*side*0.6+vx*0.04,
        vy:ny*side*0.6+vy*0.04,
        life:1,
        decay:0.018+Math.random()*0.012,
        w:1+spd*0.04,
      });
    }
    // Tiny foam flecks on faster movement
    if(spd>8){
      for(let k=0;k<2;k++){
        wakeTrail.push({
          x:mouseX+(Math.random()-0.5)*14,
          y:mouseY+(Math.random()-0.5)*14,
          vx:(Math.random()-0.5)*0.8,
          vy:(Math.random()-0.5)*0.8-0.3,
          life:0.7+Math.random()*0.3,
          decay:0.035+Math.random()*0.02,
          w:0.6+Math.random()*1.2,
          foam:true,
        });
      }
    }
    if(wakeTrail.length>200) wakeTrail=wakeTrail.slice(-200);
  }
  scatterBubbles();
});


function drawRush(t){
  rushCtx.clearRect(0,0,W(),H());

  // Draw wake trail
  wakeTrail=wakeTrail.filter(p=>p.life>0);
  wakeTrail.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    p.vx*=0.96; p.vy*=0.96;
    p.life-=p.decay;
    if(p.life<=0) return;
    rushCtx.save();
    if(p.foam){
      rushCtx.globalAlpha=p.life*0.5;
      rushCtx.beginPath();
      rushCtx.arc(p.x,p.y,p.w,0,Math.PI*2);
      rushCtx.fillStyle='rgba(220,240,252,1)';
      rushCtx.fill();
    } else {
      rushCtx.globalAlpha=p.life*0.22;
      rushCtx.strokeStyle=`rgba(190,228,248,1)`;
      rushCtx.lineWidth=p.w*p.life;
      rushCtx.lineCap='round';
      rushCtx.beginPath();
      rushCtx.moveTo(p.x,p.y);
      rushCtx.lineTo(p.x+p.vx*4,p.y+p.vy*4);
      rushCtx.stroke();
    }
    rushCtx.restore();
  });


}

// ══════════════════════════
// GOD RAYS — soft & blended
// ══════════════════════════
const raysCanvas=document.getElementById('rays-canvas');
const rCtx=raysCanvas.getContext('2d');
let rays=[];
function initRays(){
  raysCanvas.width=W(); raysCanvas.height=H(); rays=[];
  for(let i=0;i<6;i++) rays.push({
    x:W()*(0.06+i*0.175+(Math.random()-0.5)*0.07),
    angle:(Math.random()-0.5)*0.13,
    width:190+Math.random()*230,
    opacity:0.009+Math.random()*0.011,
    speed:0.00011+Math.random()*0.00016,
    phase:(i/6)*Math.PI*2,
  });
}
function drawRays(t){
  rCtx.clearRect(0,0,W(),H());
  rays.forEach(r=>{
    const wob=Math.sin(t*r.speed+r.phase)*0.018;
    const br=0.62+0.38*Math.sin(t*r.speed*0.55+r.phase);
    const len=H()*1.6;
    const w=r.width*(0.9+0.1*Math.sin(t*r.speed*1.3+r.phase));
    rCtx.save(); rCtx.translate(r.x,-30); rCtx.rotate(r.angle+wob);
    const g=rCtx.createLinearGradient(0,0,0,len);
    g.addColorStop(0,   `rgba(215,244,252,${r.opacity*2.8*br})`);
    g.addColorStop(0.1, `rgba(165,230,244,${r.opacity*2.1*br})`);
    g.addColorStop(0.4, `rgba(90,202,232,${r.opacity*1.3*br})`);
    g.addColorStop(0.75,`rgba(55,168,218,${r.opacity*0.55*br})`);
    g.addColorStop(1,   `rgba(35,138,200,0)`);
    rCtx.fillStyle=g;
    rCtx.beginPath();
    rCtx.moveTo(-w*0.5,0); rCtx.lineTo(w*0.5,0);
    rCtx.lineTo(w*1.35,len); rCtx.lineTo(-w*1.35,len);
    rCtx.closePath(); rCtx.fill(); rCtx.restore();
  });
}

// ════════
// HAZE
// ════════
const hazeCanvas=document.getElementById('haze-canvas');
const hCtx=hazeCanvas.getContext('2d');
function initHaze(){ hazeCanvas.width=W(); hazeCanvas.height=H(); }
function drawHaze(t){
  hCtx.clearRect(0,0,W(),H());
  const b=0.5+0.5*Math.sin(t*0.0004);
  const g1=hCtx.createRadialGradient(W()*0.28,0,0,W()*0.28,0,W()*0.72);
  g1.addColorStop(0,`rgba(79,216,232,${0.04*b})`); g1.addColorStop(1,'rgba(79,216,232,0)');
  hCtx.fillStyle=g1; hCtx.fillRect(0,0,W(),H());
  const g2=hCtx.createRadialGradient(W()*0.76,H()*0.08,0,W()*0.76,H()*0.08,W()*0.5);
  g2.addColorStop(0,`rgba(120,160,255,${0.026*(1-b)})`); g2.addColorStop(1,'rgba(120,160,255,0)');
  hCtx.fillStyle=g2; hCtx.fillRect(0,0,W(),H());
}

// ══════════════════
// SPARKLE PARTICLES
// ══════════════════
const pCanvas=document.getElementById('part-canvas');
const pCtx=pCanvas.getContext('2d');
let particles=[];
function initParticles(){
  pCanvas.width=W(); pCanvas.height=H(); particles=[];
  for(let i=0;i<130;i++) particles.push(makeParticle(true));
}
function makeParticle(rndY=false){
  const isSpark=Math.random()>0.52;
  return {
    x:Math.random()*W(), y:rndY?Math.random()*H():H()+10,
    size:isSpark?0.85+Math.random()*1.6:0.4+Math.random()*0.95,
    speed:0.065+Math.random()*0.21,
    opacity:isSpark?0.38+Math.random()*0.42:0.07+Math.random()*0.16,
    drift:(Math.random()-0.5)*0.14,
    phase:Math.random()*Math.PI*2,
    twinkle:0.001+Math.random()*0.003,
    hue:175+Math.random()*95,
    isSpark, isBurst:false,
  };
}
function drawParticles(t){
  pCtx.clearRect(0,0,W(),H());
  particles.forEach((p,i)=>{
    const dx=p.x-mouseX,dy=p.y-mouseY,d=Math.sqrt(dx*dx+dy*dy);
    if(d<70&&d>0){p.x+=dx/d*0.3;p.y+=dy/d*0.3;}
    p.y-=p.speed; p.x+=Math.sin(t*0.0003+p.phase)*p.drift;
    if(p.y<-10) particles[i]=makeParticle(false);
    const tw=0.4+0.6*Math.sin(t*p.twinkle+p.phase);
    if(p.isSpark){
      pCtx.save(); pCtx.globalAlpha=p.opacity*tw;
      pCtx.translate(p.x,p.y);
      pCtx.fillStyle=`hsla(${p.hue},92%,96%,1)`;
      const r=p.size*(0.5+tw*0.5);
      pCtx.fillRect(-r*2.1,-r*0.32,r*4.2,r*0.64);
      pCtx.fillRect(-r*0.32,-r*2.1,r*0.64,r*4.2);
      pCtx.restore();
    } else {
      pCtx.beginPath(); pCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
      pCtx.fillStyle=`rgba(175,228,242,${p.opacity*(0.5+tw*0.5)})`; pCtx.fill();
    }
  });
}

// ══════════════════════════════
// FLOATING MUSIC NOTES & SYMBOLS
// ══════════════════════════════
const nCanvas=document.getElementById('notes-canvas');
const nCtx=nCanvas.getContext('2d');
let musicNotes=[];

const NOTE_GLYPHS=['♩','♪','♫','♬','𝄞','𝄢','♭','♯','𝄽'];

function initNotes(){
  nCanvas.width=W(); nCanvas.height=H(); musicNotes=[];
  for(let i=0;i<22;i++) musicNotes.push(makeNote(true));
}
function makeNote(rndY=false){
  return {
    glyph:NOTE_GLYPHS[Math.floor(Math.random()*NOTE_GLYPHS.length)],
    x:Math.random()*W(),
    y:rndY?Math.random()*H():H()+60,
    size:12+Math.random()*22,
    speed:0.04+Math.random()*0.14,
    drift:(Math.random()-0.5)*0.22,
    phase:Math.random()*Math.PI*2,
    rotSpeed:(Math.random()-0.5)*0.0008,
    rot:Math.random()*Math.PI*2,
    opacity:0.12+Math.random()*0.3,
    hue:175+Math.random()*120,
    twinkle:0.0008+Math.random()*0.002,
  };
}
function drawNotes(t){
  nCtx.clearRect(0,0,W(),H());
  musicNotes.forEach((n,i)=>{
    n.y-=n.speed;
    n.x+=Math.sin(t*0.0004+n.phase)*n.drift;
    n.rot+=n.rotSpeed;
    if(n.y<-60) musicNotes[i]=makeNote(false);
    const tw=0.5+0.5*Math.sin(t*n.twinkle+n.phase);
    const glow=`hsla(${n.hue},85%,80%,${n.opacity*tw})`;
    nCtx.save();
    nCtx.translate(n.x,n.y);
    nCtx.rotate(n.rot);
    // Outer glow
    nCtx.shadowColor=`hsla(${n.hue},90%,80%,0.6)`;
    nCtx.shadowBlur=10+8*tw;
    nCtx.globalAlpha=n.opacity*tw;
    nCtx.fillStyle=glow;
    nCtx.font=`${n.size}px serif`;
    nCtx.textAlign='center';
    nCtx.textBaseline='middle';
    nCtx.fillText(n.glyph,0,0);
    nCtx.restore();
  });
}

// ═══════════════
// CREATURES
// ═══════════════
const cCanvas=document.getElementById('creat-canvas');
const cCtx=cCanvas.getContext('2d');
let creatures=[];

function initCreatures(){
  cCanvas.width=W(); cCanvas.height=H();
  for(let i=0;i<9;i++) spawnFish(true);
  for(let i=0;i<5;i++) spawnJellyfish(true);
  setTimeout(()=>spawnDolphin(),9000+Math.random()*13000);
}

// ── FISH ──
function spawnFish(init=false){
  const dir=Math.random()>0.5?1:-1;
  creatures.push({
    type:'fish', dir,
    x:dir===1?(init?Math.random()*W():-70):(init?Math.random()*W():W()+70),
    y:H()*(0.12+Math.random()*0.7),
    speed:0.3+Math.random()*0.6,
    size:5+Math.random()*9,
    opacity:0.38+Math.random()*0.42,
    wavePhase:Math.random()*Math.PI*2,
    waveAmp:9+Math.random()*17,
    waveSpeed:0.0007+Math.random()*0.001,
    hue:170+Math.random()*70,
    reacting:0,
  });
}
function drawFish(f,t){
  const bobY=Math.sin(t*f.waveSpeed+f.wavePhase)*f.waveAmp;
  const sh=0.5+0.5*Math.sin(t*0.0024+f.wavePhase);
  const s=f.size;
  let scl=1;
  if(f.reacting>0){scl=1+0.32*Math.sin((1-f.reacting/30)*Math.PI);f.reacting--;}
  cCtx.save();
  cCtx.translate(f.x,f.y+bobY);
  if(f.dir===-1) cCtx.scale(-1,1);
  cCtx.scale(scl,scl);
  cCtx.globalAlpha=f.opacity;
  const bg=cCtx.createLinearGradient(-s,-s*0.38,s,s*0.38);
  bg.addColorStop(0,  `hsla(${f.hue-18+sh*28},75%,88%,0.92)`);
  bg.addColorStop(0.4,`hsla(${f.hue+14},52%,95%,0.96)`);
  bg.addColorStop(1,  `hsla(${f.hue+44-sh*18},62%,82%,0.82)`);
  cCtx.beginPath(); cCtx.ellipse(0,0,s,s*0.37,0,0,Math.PI*2);
  cCtx.fillStyle=bg; cCtx.fill();
  cCtx.beginPath(); cCtx.ellipse(-s*0.1,-s*0.1,s*0.43,s*0.12,-0.3,0,Math.PI*2);
  cCtx.fillStyle=`rgba(255,255,255,${0.16+sh*0.26})`; cCtx.fill();
  cCtx.beginPath();
  cCtx.moveTo(-s*0.82,0); cCtx.lineTo(-s*1.48,-s*0.38); cCtx.lineTo(-s*1.48,s*0.38);
  cCtx.closePath(); cCtx.fillStyle=`hsla(${f.hue},52%,76%,0.66)`; cCtx.fill();
  if(f.reacting>0){
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2,r=s*1.7*(1-f.reacting/30);
      cCtx.beginPath(); cCtx.arc(Math.cos(a)*r,Math.sin(a)*r,s*0.13,0,Math.PI*2);
      cCtx.fillStyle=`rgba(255,255,255,${f.reacting/30*0.55})`; cCtx.fill();
    }
  }
  cCtx.restore();
}

// ── JELLYFISH — soft dome, NOT a full ellipse ──
function spawnJellyfish(init=false){
  const pals=[
    {bell:'155,222,255,',glow:'95,202,255,', tent:'145,218,255,'},  // blue
    {bell:'185,140,255,',glow:'165,115,255,',tent:'175,130,255,'},  // purple
    {bell:'255,175,90,', glow:'255,150,55,', tent:'255,185,110,'},  // orange
    {bell:'120,200,255,',glow:'80,180,255,', tent:'130,210,255,'},  // deeper blue
    {bell:'210,165,255,',glow:'190,135,255,',tent:'200,155,255,'},  // lavender purple
    {bell:'255,160,80,', glow:'255,135,50,', tent:'255,175,100,'},  // deeper orange
  ];
  const jellyCount=creatures.filter(x=>x.type==='jelly').length;
  const p=pals[jellyCount % pals.length];
  const zone=jellyCount%5;
  const zoneX=W()*(zone/5)+W()*(0.08+Math.random()*0.08);
  const sizeClass=jellyCount%3;
  const baseSize=sizeClass===0?14:sizeClass===1?26:38;
  creatures.push({
    type:'jelly',
    x:Math.min(W()-60, Math.max(40, zoneX)),
    y:init?H()*(0.05+Math.random()*0.85):H()+90,
    size:baseSize+Math.random()*8,
    speed:0.09+Math.random()*0.15,
    drift:(Math.random()-0.5)*0.2,
    phase:Math.random()*Math.PI*2,
    pulseSpeed:0.0007+Math.random()*0.0007,
    opacity:0.72+Math.random()*0.22,
    bell:p.bell,glow:p.glow,tent:p.tent,
    reacting:0,
  });
}
function drawJellyfish(j,t){
  const pulse=Math.sin(t*j.pulseSpeed+j.phase);
  const s=j.size*(1+pulse*0.09);
  let scl=1;
  if(j.reacting>0){scl=1+0.36*Math.sin((1-j.reacting/40)*Math.PI);j.reacting--;}
  cCtx.save();
  cCtx.translate(j.x,j.y);
  cCtx.scale(scl,scl);
  cCtx.globalAlpha=j.opacity;

  // Outer aura
  const aura=cCtx.createRadialGradient(0,0,s*0.2,0,0,s*3.0);
  aura.addColorStop(0,`rgba(${j.glow}0.18)`);
  aura.addColorStop(0.4,`rgba(${j.glow}0.08)`);
  aura.addColorStop(1,`rgba(${j.glow}0)`);
  cCtx.fillStyle=aura; cCtx.beginPath(); cCtx.arc(0,0,s*3,0,Math.PI*2); cCtx.fill();

  // Inner core glow
  const ig=cCtx.createRadialGradient(0,-s*0.12,0,0,0,s*1.1);
  ig.addColorStop(0,`rgba(${j.glow}0.48)`);
  ig.addColorStop(0.5,`rgba(${j.bell}0.24)`);
  ig.addColorStop(1,`rgba(${j.bell}0)`);
  cCtx.fillStyle=ig; cCtx.beginPath(); cCtx.arc(0,0,s*1.1,0,Math.PI*2); cCtx.fill();

  // Bell — DOME ONLY: clip to top half so it looks like a mushroom/dome not a pierogi
  cCtx.save();
  cCtx.beginPath();
  // Clip region: only the upper half (y < 0)
  cCtx.rect(-s*1.5,-s*1.2,s*3,s*1.2);
  cCtx.clip();
  // Draw a rounder, taller dome
  const bg=cCtx.createRadialGradient(-s*0.2,-s*0.35,0,0,0,s*1.05);
  bg.addColorStop(0,`rgba(${j.glow}0.9)`);
  bg.addColorStop(0.35,`rgba(${j.bell}0.7)`);
  bg.addColorStop(1,`rgba(${j.bell}0.2)`);
  cCtx.beginPath();
  cCtx.arc(0,0,s,0,Math.PI*2);
  cCtx.fillStyle=bg; cCtx.fill();
  cCtx.restore();

  // Frilly skirt along the dome bottom edge
  const frills=10;
  for(let k=0;k<frills;k++){
    const a=Math.PI+(k/(frills-1))*Math.PI;
    const fx=Math.cos(a)*s, fy=Math.sin(a)*s*0.08; // near the equator
    // Small teardrop bumps
    cCtx.beginPath();
    cCtx.arc(fx,fy,s*0.1,0,Math.PI*2);
    cCtx.fillStyle=`rgba(${j.glow}0.55)`; cCtx.fill();
  }

  // Highlight
  cCtx.beginPath();
  cCtx.ellipse(-s*0.24,-s*0.38,s*0.28,s*0.14,-0.4,0,Math.PI*2);
  cCtx.fillStyle=`rgba(255,255,255,${0.34+pulse*0.12})`; cCtx.fill();

  // Tentacles from the equator
  for(let k=0;k<10;k++){
    const frac=k/9-0.5;
    const tx=frac*s*1.65;
    const w1=Math.sin(t*0.001+k*0.62+j.phase)*12;
    const w2=Math.sin(t*0.0007+k*0.44+j.phase)*7;
    cCtx.beginPath();
    cCtx.moveTo(tx,s*0.02);
    cCtx.bezierCurveTo(tx+w1,s*0.55,tx+w2,s*1.05,tx+w1*0.4,s*1.8);
    const alpha=Math.max(0,0.12+0.12*(1-Math.abs(frac)*1.6));
    cCtx.strokeStyle=`rgba(${j.tent}${alpha})`;
    cCtx.lineWidth=0.55+(1-Math.abs(frac))*0.5;
    cCtx.stroke();
  }

  // Reaction sparkles
  if(j.reacting>0){
    const prog=1-j.reacting/40;
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2, r=s*2.4*prog;
      cCtx.beginPath(); cCtx.arc(Math.cos(a)*r,Math.sin(a)*r,s*0.1,0,Math.PI*2);
      cCtx.fillStyle=`rgba(${j.glow}${(1-prog)*0.65})`; cCtx.fill();
    }
  }
  cCtx.restore();
}

// ── DOLPHIN ──
function spawnDolphin(){
  const dir=Math.random()>0.5?1:-1;
  creatures.push({type:'dolphin',dir,
    x:dir===1?-135:W()+135,
    y:H()*(0.1+Math.random()*0.38),
    speed:1.9+Math.random()*0.9,phase:0,opacity:0,done:false});
}
function drawDolphin(d,t){
  if(d.opacity<0.62) d.opacity=Math.min(0.62,d.opacity+0.011);
  const bob=Math.sin(t*0.003+d.phase)*15, s=28;
  cCtx.save();
  cCtx.translate(d.x,d.y+bob);
  if(d.dir===-1) cCtx.scale(-1,1);
  cCtx.globalAlpha=d.opacity;
  cCtx.beginPath(); cCtx.ellipse(0,0,s,s*0.33,0,0,Math.PI*2);
  cCtx.fillStyle='rgba(85,165,200,0.7)'; cCtx.fill();
  cCtx.beginPath(); cCtx.ellipse(s*1.1,0,s*0.33,s*0.13,0,0,Math.PI*2);
  cCtx.fillStyle='rgba(85,165,200,0.6)'; cCtx.fill();
  cCtx.beginPath(); cCtx.moveTo(0,-s*0.3); cCtx.lineTo(s*0.27,-s*0.66); cCtx.lineTo(s*0.47,-s*0.3); cCtx.closePath();
  cCtx.fillStyle='rgba(60,142,182,0.6)'; cCtx.fill();
  cCtx.beginPath(); cCtx.moveTo(-s,0); cCtx.lineTo(-s*1.48,-s*0.4); cCtx.lineTo(-s*1.48,s*0.4); cCtx.closePath();
  cCtx.fillStyle='rgba(60,142,182,0.56)'; cCtx.fill();
  cCtx.restore();
}

// ── CLICK ON CREATURES ──
cCanvas.addEventListener('click',e=>{
  const rect=cCanvas.getBoundingClientRect();
  const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  creatures.forEach(c=>{
    if(c.type==='fish'){const dx=cx-c.x,dy=cy-c.y;if(Math.sqrt(dx*dx+dy*dy)<c.size*2.4)c.reacting=30;}
    if(c.type==='jelly'){const dx=cx-c.x,dy=cy-c.y;if(Math.sqrt(dx*dx+dy*dy)<c.size*2.2)c.reacting=40;}
  });
});

function updateCreatures(t){
  cCtx.clearRect(0,0,W(),H());
  creatures=creatures.filter(c=>!c.done);
  for(let i=creatures.length-1;i>=0;i--){
    const c=creatures[i];
    if(c.type==='fish'){
      c.x+=c.speed*c.dir; drawFish(c,t);
      if((c.dir===1&&c.x>W()+90)||(c.dir===-1&&c.x<-90)){
        creatures.splice(i,1);
        setTimeout(()=>spawnFish(),700+Math.random()*3200);
      }
    }
    if(c.type==='jelly'){
      c.y-=c.speed; c.x+=Math.sin(t*0.0008+c.phase)*c.drift;
      drawJellyfish(c,t);
      if(c.y<-115){creatures.splice(i,1);setTimeout(()=>spawnJellyfish(),1400+Math.random()*3800);}
    }
    if(c.type==='dolphin'){
      c.x+=c.speed*c.dir; c.phase+=0.05; drawDolphin(c,t);
      if((c.dir===1&&c.x>W()+165)||(c.dir===-1&&c.x<-165)){
        c.done=true; setTimeout(()=>spawnDolphin(),22000+Math.random()*30000);
      }
    }
  }
}

// BUBBLE SYSTEM — smooth float, cluster, expand
// ════════════════════════════════════════════
const settledBubbles=[];
let expandedBubble=null;

function getBW(text){ return Math.min(192,76+text.length*2.95); }

function findClusterPos(w){
  // Keep all bubbles in the upper-center zone
  const zoneX=W()*0.5, zoneY=H()*0.28;
  const spread=Math.min(W()*0.28, 180);
  if(settledBubbles.length===0) return {x:zoneX-w/2, y:zoneY-w/2};
  let best=null,bestScore=Infinity;
  for(let i=0;i<60;i++){
    const angle=Math.random()*Math.PI*2;
    const radius=(w*0.5)+Math.random()*spread;
    const tx=zoneX+Math.cos(angle)*radius;
    const ty=zoneY+Math.sin(angle)*radius*0.7;
    const x=Math.max(8,Math.min(W()-w-8,tx-w/2));
    const y=Math.max(8,Math.min(H()*0.58,ty-w/2));
    let ok=true;
    for(const b of settledBubbles){
      const dx=(x+w/2)-(b.x+b.w/2),dy=(y+w/2)-(b.y+b.w/2);
      if(Math.sqrt(dx*dx+dy*dy)<(w/2+b.w/2)*0.78){ok=false;break;}
    }
    if(ok){
      const score=Math.abs(tx-zoneX)+Math.abs(ty-zoneY);
      if(score<bestScore){bestScore=score;best={x,y};}
    }
  }
  return best||{x:Math.max(8,Math.min(W()-w-8,zoneX-w/2+(Math.random()-0.5)*60)),y:Math.max(8,zoneY-w/2+(Math.random()-0.5)*30)};
}

function launchBubble(text){
  const container=document.getElementById('bubbles-container');
  const w=getBW(text);
  const el=document.createElement('div');
  el.className='bubble';
  el.style.width=w+'px'; el.style.minHeight=w+'px';
  el.textContent=text;
  const startX=W()*0.3+Math.random()*W()*0.4;
  const startY=H()-148;
  el.style.left=(startX-w/2)+'px';
  el.style.top=startY+'px';
  container.appendChild(el);

  const {x:dX,y:dY}=findClusterPos(w);
  const totalDY=startY-dY; // how far up it needs to travel

  // Use JS animation for ultra-smooth rise — no CSS keyframes that can jump
  const sway=(Math.random()-0.5)*50;
  const dur=3800+Math.random()*1200;
  let startTime=null;

  // Phase 1: grow from nothing over 700ms
  let growStart=null;
  function growStep(ts){
    if(!growStart) growStart=ts;
    const prog=Math.min(1,(ts-growStart)/700);
    // cubic ease-out
    const ease=1-Math.pow(1-prog,3);
    el.style.opacity=String(ease);
    el.style.transform=`scale(${ease})`;
    if(prog<1){ requestAnimationFrame(growStep); }
    else {
      el.style.transform='scale(1)';
      el.style.opacity='1';
      requestAnimationFrame(riseStep);
    }
  }

  // Phase 2: float up smoothly via JS lerp
  function riseStep(ts){
    if(!startTime) startTime=ts;
    const elapsed=ts-startTime;
    const prog=Math.min(1,elapsed/dur);
    // smooth ease-in-out
    const ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
    const curX=sway*Math.sin(prog*Math.PI);  // gentle side sway arc
    const curY=-totalDY*ease;
    el.style.transform=`translateY(${curY}px) translateX(${curX}px) scale(1)`;
    if(prog<1){ requestAnimationFrame(riseStep); }
    else {
      // Phase 3: snap to cluster position, shrink
      el.style.transition='none';
      el.style.transform='';
      el.style.left=dX+'px';
      el.style.top=dY+'px';
      // Force reflow then animate in settled state
      el.getBoundingClientRect();
      el.style.setProperty('--bubble-scale','0.68');
      el.style.setProperty('--idle-dur',(3.2+Math.random()*2.5)+'s');
      el.classList.add('settled');
      const rec={el,x:dX,y:dY,w,origX:dX,origY:dY};
      settledBubbles.push(rec);
      attachBubbleEvents(el,rec);
    }
  }

  requestAnimationFrame(growStep);
}

function attachBubbleEvents(el,rec){
  el.addEventListener('click',e=>{
    e.stopPropagation();
    if(expandedBubble&&expandedBubble!==rec){
      // collapse old
      const old=expandedBubble;
      old.el.classList.remove('expanded');
      old.el.style.setProperty('--bubble-scale','0.68');
      old.el.classList.add('settled');
      // restore all positions
      settledBubbles.forEach(b=>{ b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; });
      expandedBubble=null;
    }
    if(expandedBubble===rec){
      // collapse this one
      el.classList.remove('expanded');
      el.style.setProperty('--bubble-scale','0.68');
      el.classList.add('settled');
      expandedBubble=null;
      settledBubbles.forEach(b=>{ b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; });
    } else {
      // expand
      el.classList.remove('settled');
      el.classList.add('expanded');
      expandedBubble=rec;
      pushOthersAway(rec);
    }
  });
}

// Dismiss expanded bubble when clicking ocean background
document.addEventListener('click',e=>{
  if(!expandedBubble) return;
  if(!expandedBubble.el.contains(e.target)){
    expandedBubble.el.classList.remove('expanded');
    expandedBubble.el.style.setProperty('--bubble-scale','0.68');
    expandedBubble.el.classList.add('settled');
    settledBubbles.forEach(b=>{ b.el.style.left=b.x+'px'; b.el.style.top=b.y+'px'; });
    expandedBubble=null;
  }
});

function pushOthersAway(rec){
  const cx=rec.x+rec.w/2, cy=rec.y+rec.w/2;
  settledBubbles.forEach(b=>{
    if(b===rec)return;
    const dx=(b.x+b.w/2)-cx, dy=(b.y+b.w/2)-cy;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const push=Math.max(0,145-dist)*0.5;
    b.el.style.left=Math.max(4,Math.min(W()-b.w-4,b.x+(dx/dist)*push))+'px';
    b.el.style.top =Math.max(4,Math.min(H()-b.w-4,b.y+(dy/dist)*push))+'px';
  });
}

function scatterBubbles(){
  settledBubbles.forEach(b=>{
    if(b===expandedBubble)return;
    const cx=b.x+b.w/2, cy=b.y+b.w/2;
    const dx=cx-mouseX, dy=cy-mouseY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120&&dist>0){
      const push=(120-dist)*0.15;
      b.el.style.left=Math.max(4,Math.min(W()-b.w-4,b.x+(dx/dist)*push))+'px';
      b.el.style.top =Math.max(4,Math.min(H()-b.w-4,b.y+(dy/dist)*push))+'px';
    }
  });
}

// ── INPUT STATE MACHINE ──
const myKeys=new Set();
let inputStep='song'; // 'song' | 'artist'
let pendingSong='';
let isProcessing=false;

const songInput=document.getElementById('song-input');
const sendBtn=document.getElementById('send-btn');

const PROFANITY=/\b(fuck|shit|ass|bitch|damn|crap|hell|bastard|dick|cock|pussy|whore|slut|nigger|nigga|faggot|fag|cunt|piss|bastard)\b/i;

function normalize(str){
  // lowercase, strip punctuation except apostrophes, collapse spaces
  return str.toLowerCase().replace(/[^\w\s']/g,'').replace(/\s+/,' ').trim();
}

function expandArtist(raw){
  const n=normalize(raw);
  if(n==='elevation'||n==='elevation worship') return 'Elevation Worship';
  if(n==='hillsong'||n==='hillsong worship') return 'Hillsong Worship';
  if(n==='hillsong united') return 'Hillsong United';
  if(n==='hillsong young and free'||n==='hillsong y&f') return 'Hillsong Young & Free';
  if(n==='bethel'||n==='bethel worship'||n==='bethel music') return 'Bethel Music';
  // Title-case as fallback
  return raw.replace(/\b\w/g,ch=>ch.toUpperCase());
}

// ── TEXT HELPERS ──
const SKIP_WORDS=new Set(['a','an','the','and','but','or','nor','for','so','yet','at','by','in','of','on','to','up','as','is','it']);
const HOLY_WORDS={'god':'God','jesus':'Jesus','lord':'Lord','he':'He','him':'Him','his':'His','holy':'Holy'};

function titleCase(str){
  return str.trim().replace(/[^a-zA-Z0-9\s'\-]/g,'').split(' ').map((w,i)=>{
    if(!w) return w;
    const low=w.toLowerCase();
    if(HOLY_WORDS[low]) return HOLY_WORDS[low];
    if(i>0&&SKIP_WORDS.has(low)) return low;
    return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();
  }).join(' ');
}

function holyCase(str){
  return str.replace(/\b(god|jesus|lord|he|him|his|holy)\b/gi,m=>HOLY_WORDS[m.toLowerCase()]||m);
}

function handleSubmit(){
  if(isProcessing)return;
  const val=songInput.value.trim();
  if(!val)return;

  if(inputStep==='song'){
    if(PROFANITY.test(val)){
      songInput.value='';
      songInput.placeholder="keep it clean! try another song ☁️";
      setTimeout(()=>songInput.placeholder="a worship song I'd love to dive into…",2500);
      return;
    }
    pendingSong=val;
    // Animate input swap: fade out, change placeholder, fade in
    songInput.style.transition='opacity 0.25s';
    songInput.style.opacity='0';
    setTimeout(()=>{
      songInput.value='';
      songInput.placeholder="who's the artist?";
      songInput.style.opacity='1';
      songInput.focus();
      inputStep='artist';
    },250);

  } else if(inputStep==='artist'){
    if(PROFANITY.test(val)){
      songInput.value='';
      return;
    }
    const artist=expandArtist(val);
    const song=titleCase(pendingSong);
    songInput.style.transition='opacity 0.25s';
    songInput.style.opacity='0';
    setTimeout(()=>{
      songInput.value='';
      songInput.placeholder="loading…";
      songInput.style.opacity='1';
      inputStep='loading';
    },250);
    isProcessing=true;
    const displayText=song+' — '+artist;
    processSubmission(song, artist, displayText);
  }
}

async function processSubmission(song, artist, displayText){
  // Launch bubble immediately
  if(window.saveToFirebaseAndSheets) window.saveToFirebaseAndSheets(displayText);
  else { launchBubble(displayText); saveToSheets(displayText); }

  // Reset input
  setTimeout(()=>{
    songInput.style.transition='opacity 0.25s';
    songInput.style.opacity='0';
    setTimeout(()=>{
      songInput.placeholder="a worship song I'd love to dive into…";
      songInput.style.opacity='1';
      songInput.value='';
      inputStep='song';
      isProcessing=false;
    },250);
  },400);

  // Look up lyric from local library — show AFTER bubble has risen (~4s)
  const lyric = findLyric(song, artist);
  if (lyric && !PROFANITY.test(lyric)) {
    setTimeout(() => animateLyricCanvas(lyric), 3800);
  }
}

// ── LYRIC CANVAS ANIMATION ──
const lCanvas=document.getElementById('lyric-canvas');
const lCtx=lCanvas.getContext('2d');
let lyricAnim=null;

function animateLyricCanvas(lyric){
  if(lCanvas.width!==W()||lCanvas.height!==H()){lCanvas.width=W();lCanvas.height=H();}
  lCtx.clearRect(0,0,W(),H());
  const totalDur=9000; // nice and slow so it's readable
  const startT=performance.now();
  const cx=W()/2;
  const cy=H()*0.52; // center of screen, slightly below middle

  const noteGlyphs=['♩','♪','♫','♬'];
  const notes=[];
  for(let i=0;i<5;i++){
    notes.push({
      glyph:noteGlyphs[i%noteGlyphs.length],
      offsetX:(Math.random()-0.5)*160,
      offsetY:(Math.random()-0.5)*30,
      size:6+Math.random()*4,
      phase:Math.random()*Math.PI*2,
      opacity:0.15+Math.random()*0.15,
    });
  }

  function frame(now){
    const elapsed=now-startT;
    const prog=Math.min(1,elapsed/totalDur);
    // Very slow fade in (0-20%), long hold (20-75%), gentle fade out (75-100%)
    let alpha;
    if(prog<0.20) alpha=prog/0.20;
    else if(prog<0.75) alpha=1;
    else alpha=1-(prog-0.75)/0.25;

    lCtx.clearRect(0,0,W(),H());
    if(prog>=1){ lCtx.clearRect(0,0,W(),H()); return; }

    const t=elapsed;
    // Gentle wave — stays centered, just undulates softly in place
    const waveY=Math.sin(t*0.0006)*5+Math.sin(t*0.0004+1.2)*3;
    const waveX=Math.sin(t*0.0005+0.8)*4;
    const ty=cy+waveY;
    const tx=cx+waveX;

    lCtx.save();

    // Soft notes around the lyric, also gently drifting
    notes.forEach(n=>{
      const nx=tx+n.offsetX+Math.sin(t*0.0008+n.phase)*8;
      const ny=ty+n.offsetY+Math.cos(t*0.0006+n.phase)*5;
      lCtx.globalAlpha=alpha*n.opacity;
      lCtx.fillStyle='rgba(215,228,238,1)';
      lCtx.font=`${n.size}px serif`;
      lCtx.textAlign='center';
      lCtx.textBaseline='middle';
      lCtx.fillText(n.glyph,nx,ny);
    });

    // Lyric — small, italic, white-grey, centered, wavy
    lCtx.globalAlpha=alpha*0.78;
    lCtx.fillStyle='rgba(215,228,238,1)';
    lCtx.font='italic 300 10px "Jost",sans-serif';
    lCtx.textAlign='center';
    lCtx.textBaseline='middle';
    lCtx.letterSpacing='0.1em';
    lCtx.fillText(holyCase(lyric.toLowerCase()),tx,ty);

    lCtx.restore();
    lyricAnim=requestAnimationFrame(frame);
  }
  if(lyricAnim) cancelAnimationFrame(lyricAnim);
  lyricAnim=requestAnimationFrame(frame);
}

function findLyric(song,artist){
  function clean(s){
    return s.toLowerCase()
      .replace(/[^a-z0-9 ]/g,'')
      .replace(/\s+/g,' ')
      .trim();
  }
  const cs=clean(song), ca=clean(artist);
  // Direct song title match
  if(SONG_LYRICS[cs]) return SONG_LYRICS[cs];
  // Song + first artist word
  const artistWord=ca.split(' ')[0];
  const combos=[cs+' '+ca, cs+' '+artistWord, artistWord+' '+cs];
  for(const k of combos){if(SONG_LYRICS[k])return SONG_LYRICS[k];}
  // Substring match — key inside song title or song title inside key
  for(const key of Object.keys(SONG_LYRICS)){
    const ck=clean(key);
    if(cs===ck) return SONG_LYRICS[key];
    if(cs.length>3&&ck.includes(cs)) return SONG_LYRICS[key];
    if(ck.length>3&&cs.includes(ck)) return SONG_LYRICS[key];
  }
  return null;
}

// Anonymous sign-in

window.saveToFirebaseAndSheets = function(text) {
  saveToSheets(text);
  // Add a timestamp-based pending key BEFORE push so listener skips it immediately
  const pendingKey = 'pending_' + Date.now();
  myKeys.add(pendingKey);
  launchBubble(text); // launch once locally
  push(suggestionsRef, { song: text, timestamp: serverTimestamp() })
    .then(snap => {
      myKeys.delete(pendingKey);
      myKeys.add(snap.key); // swap to real key
    })
    .catch(() => { myKeys.delete(pendingKey); });
};

// Load existing bubbles on page load, then listen for new ones
let initialLoadDone = false;
const existingBubbles = [];

onChildAdded(suggestionsRef, snap => {
  const song = snap.val()?.song;
  if (!song) return;
  if (!initialLoadDone) {
    existingBubbles.push(snap.key + '|' + song);
    return;
  }
  // New real-time submission — skip our own
  if (myKeys.has(snap.key)) return;
  setTimeout(() => launchBubble(song), Math.random() * 800);
});

// Stagger-launch existing bubbles after page loads
setTimeout(() => {
  initialLoadDone = true;
  existingBubbles.forEach((entry, i) => {
    const song = entry.split('|').slice(1).join('|');
    setTimeout(() => launchBubble(song), i * 600);
  });
}, 2500);
</script>
