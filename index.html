<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deep Dive 🌊</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;

  background: radial-gradient(
    circle at 50% 20%,
    #2bc4e0 0%,
    #0b3a55 40%,
    #00111f 75%,
    #00070d 100%
  );
}

/* 🌊 LIGHT RAYS */
.ocean-light {
  position: absolute;
  width: 200%;
  height: 100%;
  background: linear-gradient(
    120deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.03) 40%,
    rgba(255,255,255,0.07) 50%,
    rgba(255,255,255,0.03) 60%,
    rgba(255,255,255,0) 100%
  );
  animation: lightMove 18s linear infinite;
  z-index: 1;
}

@keyframes lightMove {
  0% { transform: translateX(-20%); }
  100% { transform: translateX(20%); }
}

/* 🌫️ HAZE */
.water-haze {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(
    circle at 30% 40%,
    rgba(255,255,255,0.06),
    transparent 60%
  );
  animation: haze 18s ease-in-out infinite alternate;
  z-index: 1;
}

@keyframes haze {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-20px); }
}

/* UI LAYER */
.container {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  z-index: 20;
}

input {
  padding: 10px;
  width: 280px;
  border-radius: 20px;
  border: none;
  outline: none;

  background: rgba(255,255,255,0.15);
  color: white;
  backdrop-filter: blur(6px);
}

input::placeholder {
  color: rgba(255,255,255,0.7);
}

button {
  padding: 10px 14px;
  border-radius: 20px;
  border: none;
  background: #00c2ff;
  color: white;
  cursor: pointer;
  margin-left: 8px;
}

/* 🌊 OCEAN */
.ocean {
  position: absolute;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  z-index: 10;
}

/* 🫧 BUBBLES */
.bubble {
  position: absolute;
  max-width: 220px;
  padding: 12px 14px;

  background: rgba(255,255,255,0.22);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 40px;

  backdrop-filter: blur(8px);
  color: white;

  font-size: 13px;
  text-align: center;

  box-shadow: 0 0 25px rgba(120,220,255,0.2);

  animation: rise 14s ease-in-out forwards;
  z-index: 30;
}

@keyframes rise {
  0% {
    transform: translateY(100vh) scale(0.8);
    opacity: 0;
  }
  15% { opacity: 1; }
  50% { transform: translateY(40vh) translateX(20px); }
  100% {
    transform: translateY(-120px) translateX(-10px);
    opacity: 0;
  }
}

/* 🐟 fish */
.fish {
  position: absolute;
  font-size: 18px;
  opacity: 0.5;
  animation: swim 18s linear infinite;
}

@keyframes swim {
  0% { transform: translateX(-10vw); }
  100% { transform: translateX(110vw); }
}

/* 🐬 dolphin */
.dolphin {
  position: absolute;
  font-size: 24px;
  opacity: 0.35;
  animation: dolphin 22s linear infinite;
}

@keyframes dolphin {
  0% { transform: translateX(-20vw); }
  50% { transform: translateX(50vw) translateY(-40px); }
  100% { transform: translateX(120vw); }
}

/* 🪼 jellyfish */
.jelly {
  position: absolute;
  font-size: 22px;
  opacity: 0.4;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
  animation: floatJ 10s ease-in-out infinite;
}

@keyframes floatJ {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}

/* bottom text */
.bottomText {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
  z-index: 20;
}

.bottomText .title {
  font-size: 24px;
  letter-spacing: 2px;
}

.bottomText .subtitle {
  font-size: 13px;
  opacity: 0.75;
  margin-top: 6px;
}
</style>
</head>

<body>

<!-- BACKGROUND LAYERS -->
<div class="ocean-light"></div>
<div class="water-haze"></div>

<!-- INPUT -->
<div class="container">
  <form id="form">
    <input id="input" placeholder="Drop a song for deep dive..." />
    <button>Send 🫧</button>
  </form>
</div>

<!-- OCEAN -->
<div class="ocean" id="ocean"></div>

<!-- BOTTOM TEXT -->
<div class="bottomText">
  <div class="title">deep-dive</div>
  <div class="subtitle">what song do you want to take a deep-dive into?</div>
</div>

<script>
const ocean = document.getElementById("ocean");
const form = document.getElementById("form");
const input = document.getElementById("input");

/* 🔌 FIREBASE (optional plug-in later)
const db = firebase.database();
const tipsRef = db.ref("tips");
*/

form.addEventListener("submit", (e) => {
  e.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  createBubble(text);

  /* tipsRef.push({ text, time: Date.now() }); */

  input.value = "";
});

/* 🫧 bubbles */
function createBubble(text) {
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerText = text;

  b.style.left = Math.random() * 70 + "%";
  b.style.animationDuration = (10 + Math.random() * 6) + "s";

  ocean.appendChild(b);
  setTimeout(() => b.remove(), 15000);
}

/* 🐟 fish */
setInterval(() => {
  const f = document.createElement("div");
  f.className = "fish";
  f.innerText = "🐟";
  f.style.top = Math.random() * 80 + "%";
  ocean.appendChild(f);
}, 3000);

/* 🐬 dolphins */
setInterval(() => {
  const d = document.createElement("div");
  d.className = "dolphin";
  d.innerText = "🐬";
  d.style.top = Math.random() * 60 + "%";
  ocean.appendChild(d);
}, 8000);

/* 🪼 jellyfish */
setInterval(() => {
  const j = document.createElement("div");
  j.className = "jelly";
  j.innerText = "🪼";
  j.style.left = Math.random() * 90 + "%";
  j.style.top = Math.random() * 80 + "%";
  ocean.appendChild(j);
}, 2500);
</script>

</body>
</html>
