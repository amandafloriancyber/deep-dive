<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deep Dive Tips 🌊</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(#003366, #006994, #00aaff);
      color: white;
    }

    .container {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border-radius: 20px;
      border: none;
      margin-left: 10px;
      background: #00c2ff;
      color: white;
      cursor: pointer;
    }

    .ocean {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .bubble {
      position: absolute;
      max-width: 200px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      backdrop-filter: blur(5px);
      text-align: center;
      font-size: 14px;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120px) scale(1);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>🌊 Deep Dive Song Tips</h2>
    <form id="form">
      <input id="input" placeholder="Suggest a song..." />
      <button type="submit">Send 🫧</button>
    </form>
  </div>

  <div class="ocean" id="ocean"></div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const ocean = document.getElementById("ocean");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      createBubble(text);
      input.value = "";
    });

    function createBubble(text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerText = text;

      bubble.style.left = Math.random() * 80 + "%";
      bubble.style.animationDuration = (8 + Math.random() * 6) + "s";

      ocean.appendChild(bubble);

      setTimeout(() => {
        bubble.remove();
      }, 12000);
    }
  </script>

</body>
</html>
